        body {

        /*.site-header {

        .logo {
            height: 72px;
        }

        /* Main section */
        .maintenance {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 60px;
        }

            .maintenance .container-fluid {
                padding: 0;
            }

        .img-fluid {
            max-height: 566px;
        }



        .maintenance-text h1 {
            /*font-size: 34px;*/
            font-weight: 700;
            margin: 20px 0 31px;
            color: #103859;
        }

        .maintenance-text p {
            font-size: 18px;
            line-height: 1.2;
            color: #8f9ab5;
            max-width: 400px;
            margin-bottom: 30px;
        }


        h1, h2, h3, h4, h5, h6 {
            margin: 0;
            padding: 0;
        }

        /* tablets */
        @media (max-width: 991px) {
            .maintenance {
                padding: 0 30px;
            }

            .maintenance-text h1 {
                font-size: 28px;
            }

            .maintenance-text p {
                font-size: 16px;
            }
        }

        @media (max-width: 767px) {
            .maintenance {
                padding: 40px 20px;
            }

            .maintenance-text {
                text-align: center;
                margin-bottom: 24px;
            }

            .logo {
                height: 56px;
            }

            .maintenance-text h1 {
                font-size: 24px;
                margin: 16px 0 12px;
            }

            .maintenance-text p {
                margin: 0 auto;
            }

            .maintenance .img-fluid {
                max-height: 320px;
            }
        }
    </style>

</head>
